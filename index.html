<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d31">
  <meta name="description" content="來玩一場充滿節日氣氛的聖誕拉霸！轉動轉軸，收集雪花與禮物。">
  <title>冬日幸運所 | 聖誕拉霸</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');

    :root {
      color-scheme: light;
      --pine: #123d31;
      --pine-dark: #0c2e26;
      --pine-light: #235a48;
      --berry: #bd3b45;
      --berry-dark: #9c2c37;
      --gold: #f0bf62;
      --cream: #fffaf0;
      --ink: #20362e;
      --muted: #779087;
      --snow: #f2f7f1;
      font-family: "DM Sans", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: var(--snow);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background-color: var(--snow);
      background-image: radial-gradient(#c9dacf 0.75px, transparent 0.75px);
      background-size: 19px 19px;
    }

    button { font: inherit; }

    .page-shell { min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      height: 70px;
      padding: 0 clamp(20px, 6vw, 88px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--pine-dark);
      color: #fffaf0;
      border-bottom: 1px solid rgba(240, 191, 98, 0.26);
    }

    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 800; letter-spacing: 0.04em; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; background: var(--berry); border-radius: 50%; font-size: 18px; }
    .season-tag { display: flex; align-items: center; gap: 8px; color: #d3e2d8; font-size: 12px; font-weight: 600; }
    .season-tag::before { content: ""; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 12px #f0bf62; }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 47px 0 35px;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(440px, 1.12fr);
      align-items: center;
      gap: clamp(32px, 6vw, 86px);
    }

    .intro { padding: 0 0 28px 4px; animation: arrive 700ms both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--berry); font-size: 11px; font-weight: 800; letter-spacing: 0.17em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 24px; height: 2px; background: var(--berry); }
    h1 { margin: 17px 0 15px; color: var(--pine); font-size: clamp(42px, 5vw, 67px); line-height: 1.12; font-weight: 900; letter-spacing: 0; }
    h1 span { color: var(--berry); display: block; }
    .intro-copy { max-width: 390px; margin: 0; color: #5d746a; font-size: 15px; line-height: 1.9; }

    .season-note { display: flex; align-items: center; gap: 13px; margin-top: 37px; color: #6a8076; font-size: 12px; }
    .note-icon { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #cfddd1; border-radius: 50%; background: rgba(255,255,255,.55); font-size: 17px; }
    .season-note strong { display: block; margin-bottom: 3px; color: var(--pine); font-size: 12px; }

    .machine-wrap { position: relative; animation: arrive 700ms 100ms both; }
    .machine-wrap::before, .machine-wrap::after { position: absolute; z-index: 0; color: #fff; pointer-events: none; }
    .machine-wrap::before { content: "✳"; top: -34px; right: 12%; color: var(--berry); font-size: 27px; animation: twinkle 3s ease-in-out infinite; }
    .machine-wrap::after { content: "✦"; bottom: 11%; left: -24px; color: #d9a849; font-size: 22px; animation: twinkle 3.6s ease-in-out infinite reverse; }

    .machine {
      position: relative;
      z-index: 1;
      overflow: hidden;
      padding: 23px 24px 21px;
      border: 1px solid #d5c18b;
      border-radius: 10px;
      background: var(--cream);
      box-shadow: 0 18px 48px rgba(18, 61, 49, .15), 0 4px 0 #e7d8af;
    }

    .machine::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(196, 159, 79, .37); border-radius: 6px; pointer-events: none; }
    .machine-top { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 1px 5px 15px; }
    .machine-title { color: var(--pine); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .machine-lights { display: flex; gap: 6px; }
    .machine-lights i { width: 6px; height: 6px; border-radius: 50%; background: var(--berry); box-shadow: 0 0 7px rgba(189,59,69,.45); }
    .machine-lights i:nth-child(2) { background: #e8ba59; box-shadow: 0 0 7px rgba(232,186,89,.45); }
    .machine-lights i:nth-child(3) { background: #457a59; box-shadow: 0 0 7px rgba(69,122,89,.45); }

    .display {
      position: relative;
      padding: 13px;
      border: 5px solid #d8c28c;
      border-radius: 7px;
      background: #153f32;
      box-shadow: inset 0 0 0 2px #f7e9c5, 0 3px 4px rgba(20, 45, 33, .12);
    }

    .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .reel {
      height: clamp(92px, 11vw, 126px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #dfd4b8;
      border-radius: 4px;
      background: linear-gradient(180deg, #f8f6ed 0%, #fffdf6 50%, #f2eddf 100%);
      color: var(--pine);
      font-size: clamp(43px, 5vw, 59px);
      text-shadow: 0 2px 0 rgba(26, 54, 41, .08);
      box-shadow: inset 0 7px 10px rgba(45, 59, 43, .05), inset 0 -7px 10px rgba(45, 59, 43, .06);
    }
    .reel.spinning { animation: reel-shake 100ms linear infinite; filter: blur(1.5px); }

    .payline { display: flex; align-items: center; gap: 8px; margin: 11px 3px 0; color: #cce0d4; font-size: 10px; font-weight: 700; letter-spacing: .11em; }
    .payline::before, .payline::after { content: ""; height: 1px; flex: 1; background: rgba(230, 238, 216, .28); }

    .machine-readout { min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 3px 10px; }
    .result { margin: 0; color: #6e8074; font-size: 12px; font-weight: 700; }
    .result.win { color: var(--berry); animation: pop 450ms ease-out; }
    .result.jackpot { color: #a8791d; }
    .credit { color: var(--pine); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .credit span { margin-left: 4px; color: #73857a; font-weight: 600; }

    .controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: stretch; }
    .bet-control { min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; border: 1px solid #ded5bf; border-radius: 5px; background: #fffdf7; }
    .bet-label { color: #809086; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .bet-stepper { display: flex; align-items: center; gap: 11px; }
    .step-button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid #d7ddce; border-radius: 50%; background: white; color: var(--pine); cursor: pointer; font-size: 17px; line-height: 1; transition: background 150ms, transform 150ms; }
    .step-button:hover:not(:disabled) { transform: scale(1.07); background: #edf4ea; }
    .step-button:disabled { opacity: .38; cursor: not-allowed; }
    .bet-value { min-width: 19px; color: var(--pine); font-size: 14px; font-weight: 800; text-align: center; }
    .spin-button { min-width: 140px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 0 20px; border: 0; border-radius: 5px; background: var(--berry); box-shadow: 0 3px 0 var(--berry-dark); color: white; cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: .04em; transition: transform 120ms, background 120ms, box-shadow 120ms; }
    .spin-button:hover:not(:disabled) { transform: translateY(-1px); background: #ca4650; box-shadow: 0 4px 0 var(--berry-dark); }
    .spin-button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--berry-dark); }
    .spin-button:disabled { opacity: .65; cursor: wait; }
    .spin-icon { font-size: 18px; }

    .payouts { display: flex; justify-content: space-between; gap: 8px; padding: 15px 3px 0; border-top: 1px solid #e8e0cd; margin-top: 17px; }
    .payout { display: flex; align-items: center; gap: 5px; color: #718278; font-size: 10px; white-space: nowrap; }
    .payout b { color: var(--pine); font-size: 10px; }
    .payout .pay-icon { font-size: 13px; }

    .machine-footer { margin-top: 17px; color: #839087; font-size: 10px; text-align: center; }
    .site-footer { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 17px 20px 21px; color: #73867c; font-size: 11px; }
    .site-footer span { color: var(--berry); }

    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%, 100% { opacity: .55; transform: rotate(0) scale(.9); } 50% { opacity: 1; transform: rotate(20deg) scale(1.15); } }
    @keyframes reel-shake { 0% { transform: translateY(-3px); } 100% { transform: translateY(3px); } }
    @keyframes pop { 0% { transform: scale(.85); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }

    @media (max-width: 820px) {
      main { width: min(580px, calc(100% - 36px)); grid-template-columns: 1fr; gap: 25px; padding: 39px 0 22px; }
      .intro { padding-bottom: 0; }
      h1 { margin: 12px 0 10px; font-size: clamp(40px, 9vw, 58px); }
      .intro-copy { max-width: 460px; font-size: 14px; }
      .season-note { display: none; }
      .machine { padding: 20px 21px 19px; }
      .reel { height: clamp(96px, 20vw, 125px); }
    }

    @media (max-width: 480px) {
      .topbar { height: 60px; padding: 0 18px; }
      .brand { font-size: 13px; }
      .season-tag { font-size: 10px; }
      main { width: calc(100% - 28px); padding-top: 30px; gap: 20px; }
      .eyebrow { font-size: 10px; }
      h1 { font-size: 42px; }
      .intro-copy { font-size: 13px; line-height: 1.75; }
      .machine { padding: 17px 15px 16px; }
      .display { padding: 9px; border-width: 4px; }
      .reels { gap: 6px; }
      .reel { height: 88px; font-size: 42px; }
      .controls { grid-template-columns: 1fr; }
      .bet-control { min-height: 46px; }
      .spin-button { min-height: 50px; }
      .payouts { flex-wrap: wrap; justify-content: center; gap: 8px 14px; }
      .machine-wrap::after { left: -9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span>冬日幸運所</div>
      <div class="season-tag">HOLIDAY ARCADE</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow">A little holiday luck</div>
        <h1 id="page-title">叮叮噹，<span>好運來！</span></h1>
        <p class="intro-copy">雪花落下的冬日裡，試試手氣吧。轉動拉霸，讓聖誕鈴聲和驚喜一起到來。</p>
        <div class="season-note">
          <div class="note-icon" aria-hidden="true">❄</div>
          <div><strong>冬日限定好心情</strong>沒有壓力，只有節日小驚喜。</div>
        </div>
      </section>

      <section class="machine-wrap" aria-label="聖誕拉霸遊戲">
        <div class="machine">
          <div class="machine-top">
            <div class="machine-title">HOLIDAY SLOT</div>
            <div class="machine-lights" aria-hidden="true"><i></i><i></i><i></i></div>
          </div>
          <div class="display">
            <div class="reels" aria-label="拉霸結果">
              <div class="reel" id="reel-0" aria-label="第一個轉軸">🎄</div>
              <div class="reel" id="reel-1" aria-label="第二個轉軸">🔔</div>
              <div class="reel" id="reel-2" aria-label="第三個轉軸">🎁</div>
            </div>
            <div class="payline">LUCKY LINE</div>
          </div>
          <div class="machine-readout" aria-live="polite">
            <p class="result" id="result">祝你有個閃閃發亮的聖誕！</p>
            <div class="credit" id="credit" aria-label="目前點數">100<span>點</span></div>
          </div>
          <div class="controls">
            <div class="bet-control" aria-label="設定每次下注點數">
              <span class="bet-label">每次下注</span>
              <div class="bet-stepper">
                <button class="step-button" id="bet-down" type="button" aria-label="減少下注點數">−</button>
                <span class="bet-value" id="bet-value" aria-live="polite">10</span>
                <button class="step-button" id="bet-up" type="button" aria-label="增加下注點數">+</button>
              </div>
            </div>
            <button class="spin-button" id="spin" type="button"><span class="spin-icon" aria-hidden="true">⟳</span>開始旋轉</button>
          </div>
          <div class="payouts" aria-label="中獎規則">
            <div class="payout"><span class="pay-icon">❄️</span><b>三雪花</b> × 8</div>
            <div class="payout"><span class="pay-icon">🎁</span><b>三禮物</b> × 5</div>
            <div class="payout"><span class="pay-icon">✨</span><b>任兩個相同</b> × 2</div>
          </div>
          <div class="machine-footer">虛擬點數遊戲 · 不涉及真實金錢</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">願你的冬天，充滿<span aria-hidden="true">♥</span>與驚喜</footer>
  </div>

  <script>
    const symbols = ["🎄", "🔔", "🎁", "❄️", "⭐", "🍬"];
    const reels = [0, 1, 2].map((index) => document.getElementById(`reel-${index}`));
    const spinButton = document.getElementById("spin");
    const result = document.getElementById("result");
    const creditDisplay = document.getElementById("credit");
    const betDisplay = document.getElementById("bet-value");
    const betDown = document.getElementById("bet-down");
    const betUp = document.getElementById("bet-up");
    let credits = 100;
    let bet = 10;
    let isSpinning = false;

    function updateControls() {
      creditDisplay.innerHTML = `${credits}<span>點</span>`;
      betDisplay.textContent = bet;
      betDown.disabled = isSpinning || bet <= 10;
      betUp.disabled = isSpinning || bet >= 50 || bet + 10 > credits;
      spinButton.disabled = isSpinning || credits < bet;
      spinButton.innerHTML = isSpinning
        ? '<span class="spin-icon" aria-hidden="true">⟳</span>旋轉中…'
        : '<span class="spin-icon" aria-hidden="true">⟳</span>開始旋轉';
      if (credits < bet && !isSpinning) result.textContent = "點數用完啦，重新開始一場吧！";
    }

    function chooseSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function getWinnings(outcome) {
      if (outcome.every((symbol) => symbol === "❄️")) return bet * 8;
      if (outcome.every((symbol) => symbol === "🎁")) return bet * 5;
      const counts = outcome.reduce((totals, symbol) => {
        totals[symbol] = (totals[symbol] || 0) + 1;
        return totals;
      }, {});
      return Object.values(counts).some((count) => count >= 2) ? bet * 2 : 0;
    }

    function spin() {
      if (isSpinning || credits < bet) return;
      isSpinning = true;
      credits -= bet;
      result.className = "result";
      result.textContent = "雪花正在旋轉…";
      reels.forEach((reel) => reel.classList.add("spinning"));
      updateControls();

      const outcome = reels.map(chooseSymbol);
      reels.forEach((reel, index) => {
        window.setTimeout(() => {
          reel.classList.remove("spinning");
          reel.textContent = outcome[index];
          if (index !== reels.length - 1) return;

          const winnings = getWinnings(outcome);
          credits += winnings;
          if (winnings > 0) {
            result.textContent = outcome.every((symbol) => symbol === "❄️")
              ? `雪花大獎！贏得 ${winnings} 點！`
              : `好運降臨！贏得 ${winnings} 點！`;
            result.className = outcome.every((symbol) => symbol === "❄️") ? "result win jackpot" : "result win";
          } else {
            result.textContent = "再轉一次，驚喜可能就在下一刻！";
            result.className = "result";
          }
          isSpinning = false;
          updateControls();
        }, 650 + index * 350);
      });
    }

    betDown.addEventListener("click", () => {
      if (!isSpinning) { bet = Math.max(10, bet - 10); updateControls(); }
    });
    betUp.addEventListener("click", () => {
      if (!isSpinning && bet < 50 && bet + 10 <= credits) { bet += 10; updateControls(); }
    });
    spinButton.addEventListener("click", spin);
    updateControls();
  </script>
</body>
</html>
